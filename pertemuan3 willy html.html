<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Login Mahasiswa</title>
</head>
<body>

    <h2>LOGIN MAHASISWA</h2>

    <form action="" method="POST">
        <!-- Input Email -->
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <!-- Input Password -->
        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>

        <!-- Tombol Login dan Reset -->
        <button type="submit">LOGIN</button>
        <button type="reset">RESET</button>
    </form>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Biodata Mahasiswa</title>
</head>
<body>

    <h2>BIODATA MAHASISWA</h2>

    <form action="" method="POST">
        <!-- NIM (Input Text) -->
        <label for="nim">NIM</label><br>
        <input type="text" id="nim" name="nim"><br><br>

        <!-- Nama Lengkap (Required) -->
        <label for="nama">Nama Lengkap</label><br>
        <input type="text" id="nama" name="nama" required><br><br>

        <!-- Email (Input Email) -->
        <label for="email">Email</label><br>
        <input type="email" id="email" name="email"><br><br>

        <!-- Tanggal Lahir (Input Date) -->
        <label for="tanggal_lahir">Tanggal Lahir</label><br>
        <input type="date" id="tanggal_lahir" name="tanggal_lahir"><br><br>

        <!-- Jenis Kelamin (Radio Button) -->
        <label>Jenis Kelamin</label><br>
        <input type="radio" id="laki" name="jenis_kelamin" value="Laki-laki">
        <label for="laki">Laki-laki</label><br>
        
        <input type="radio" id="perempuan" name="jenis_kelamin" value="Perempuan">
        <label for="perempuan">Perempuan</label><br><br>

        <!-- Tombol Simpan -->
        <button type="submit">SIMPAN</button>
    </form>

</body>
</html>
